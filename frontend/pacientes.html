<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pacientes - Sistema Hospitalar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header"><i class="ph ph-heartbeat"></i> HospManager</div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="index.html"><i class="ph ph-squares-four"></i> Dashboard</a></li>
            <li class="nav-item active"><a href="pacientes.html"><i class="ph ph-users"></i> Pacientes</a></li>
            <li class="nav-item"><a href="profissionais.html"><i class="ph ph-user-md"></i> Profissionais</a></li>
            <li class="nav-item"><a href="agendamento.html"><i class="ph ph-calendar-plus"></i> Agendamentos</a></li>
            <li class="nav-item"><a href="internacoes.html"><i class="ph ph-bed"></i> Internações & Quartos</a></li>
            <li class="nav-item"><a href="historico.html"><i class="ph ph-file-text"></i> Histórico Médico</a></li>
        </ul>
    </aside>
    
    <main class="main-content">
        <header class="header"><div class="user-profile"><i class="ph ph-user-circle" style="font-size: 24px;"></i> Administrador</div></header>

        <div class="content-wrapper">
            <h1 class="page-title">Gestão de Pacientes</h1>

            <div class="panel">
                <div class="panel-header"><h2>Novo Paciente</h2></div>
                <form class="form-grid">
                    <div class="form-group full-width"><label>Nome Completo</label><input type="text" placeholder="Ex: João da Silva"></div>
                    <div class="form-group"><label>CPF</label><input type="text" placeholder="000.000.000-00"></div>
                    <div class="form-group"><label>Data de Nascimento</label><input type="date"></div>
                    <div class="form-group"><label>Telefone</label><input type="text" placeholder="(00) 00000-0000"></div>
                    <div class="form-group"><label>E-mail de Contacto</label><input type="email" placeholder="email@exemplo.com"></div>
                    <div class="form-group full-width"><label>Morada Completa</label><input type="text" placeholder="Rua, Número, Bairro, Cidade - UF"></div>
                    <div class="form-group full-width" style="display: flex; justify-content: flex-end; margin-top: 10px;">
                        <button type="button" class="btn btn-outline" style="margin-right: 10px;">Cancelar</button>
                        <button type="button" class="btn btn-primary"><i class="ph ph-floppy-disk"></i> Guardar Paciente</button>
                    </div>
                </form>
            </div>

            <div class="panel">
                <div class="panel-header"><h2>Pacientes Registados</h2></div>
                <table>
                    <thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Ações</th></tr></thead>
                    <tbody>
                        <tr>
                            <td>Roberto Santos</td><td>123.456.789-00</td><td>(11) 98765-4321</td>
                            <td class="actions">
                                <button title="Ver Histórico"><i class="ph ph-file-text"></i></button>
                                <button title="Editar"><i class="ph ph-pencil-simple"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
